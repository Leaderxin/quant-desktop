[package]
name = "quant-desktop"
version = "1.8.0"
description = "A Tauri App"
authors = ["Leaderxin"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `store` targets the Microsoft Store distribution. When enabled:
#   - the built-in updater plugin is NOT registered (the Microsoft Store
#     distributes updates itself). The check_update/install_update IPC commands
#     stay compiled and registered but return early at runtime, so the frontend
#     gets a clean response instead of an "unknown command" error;
#   - Windows autostart routes through the packaged-app StartupTask WinRT API
#     instead of the registry Run key (see src-tauri/src/commands/autostart.rs).
# WebView2 is NOT bundled: MSIX installs never run the MSI's WebView2 installer
# action, so the store build relies on the system's Evergreen WebView2 runtime
# (AppxManifest MinVersion 19041 — a baseline where it is broadly preinstalled).
store = ["dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
# 全局快捷键(设置页 → 通用 → 老板键)。注册放在 Rust 侧而不是用配套的 JS
# 插件：老板键要在主窗口隐藏、整个应用失去焦点时仍然响应，而这正是 JS 侧
# 拿不到执行时机的情形。
#
# 钉在 ~2.3 而不是 "2"：2.4.0 起要求 tauri ^2.12，会让 cargo 顺势把 tauri
# (2.11.2) 连同 tao / wry / webview2-com 一起顶上去 —— 那是一次独立的依赖
# 升级，混在这个改动里既不好审，也会把刚验证过的窗口行为(show / unminimize /
# is_minimized)重新洗一遍。要升到 2.4+ 时，请单独提一次依赖更新。
tauri-plugin-global-shortcut = "~2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
encoding_rs = "0.8"
log = "0.4"
simplelog = "0.12"
thiserror = "2"
dirs = "7"
tauri-plugin-updater = "2"
raw-window-handle = "0.6"
# 原生「另存为」对话框（自选导入模板保存用）。
#
# 与下面 global-shortcut 钉 ~2.3 同一个理由：tauri-plugin-dialog 2.8 起要求
# tauri ^2.12，会让 cargo 顺势把 tauri / tao / wry 一起顶上去。npm 侧的
# @tauri-apps/plugin-dialog 必须跟着钉在 ~2.7 —— tauri build 启动时会核对
# 两侧的 major/minor（v1.6.3 tag 第一次 release 就是这样挂的）。
tauri-plugin-dialog = "~2.7"
rust_xlsxwriter = "0.102"
calamine = "0.38"

# WinRT StartupTask API for the store build's autostart (Windows only, pulled in
# by the `store` feature). Same version as the copy already in the dependency
# tree via tauri, so this adds no extra compilation.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["ApplicationModel"] }

# Linux 的「跟随系统」直接向 xdg-desktop-portal 读系统配色方案（见
# `lib.rs::linux_portal_theme`）。dbus 本来就在 Linux 构建的依赖树里
# （tao 的 `dbus` feature，tauri 默认开启），这里只是把它声明成直接依赖，
# 不会增加编译量。
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"



# Release 体积优先：LTO + 单 codegen unit + 去符号，exe/NSIS 安装包更小，
# 冷启动时 Windows Defender 的扫描与加载也更快。编译时间会翻倍左右，只影响
# release 构建。
#
# 刻意不加 `panic = "abort"`：调度器等后台任务依赖 panic 隔离（单个任务 panic
# 不应结束整个进程，见 cache/mod.rs 的 spawn 注释），abort 会把这个容错设计
# 换掉，而体积收益只有个位数百分比。
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
