<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--color-surface-1, #161b22);
      border-radius: 7px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28), 0 0 0 0.5px rgba(255, 255, 255, 0.06);
    }
    [data-theme="light"] body {
      background: var(--color-surface-1, #f6f8fa);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.10), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
    }
    /*
      设置页「透明背景」开启时由 TickerBar 挂上这个 class。

      底板、圆角、阴影必须一起去掉：只把 background 改成 transparent 的话，
      半透明阴影会留在字周围，看起来是一圈脏边。窗口本身在 tauri.conf.json 里
      已经开了 transparent: true，否则 webview 会画一层不透明底，这里怎么改
      都透不过去。
    */
    body.ticker-transparent,
    [data-theme="light"] body.ticker-transparent {
      background: transparent;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/ticker.ts"></script>
</body>
</html>
