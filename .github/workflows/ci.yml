name: CI

# 常规 CI：push / PR 时跑前端类型检查、前端单测、Rust 双编译宇宙检查与测试。
#
# 关键点：`--features store` 是一个独立的 Rust 编译宇宙（lib.rs / autostart.rs
# 中有 5+ 处 #[cfg(feature = "store")] 门控），日常构建和 release.yml 都不会
# 编译它 —— 若不在常规 CI 里覆盖，store 宇宙的编译破坏只会在手动触发商店
# 发布工作流时（最糟糕的时机）才暴露。
#
# 后端 job 必须跑在 windows-latest：store 宇宙中 Windows 专属代码
# （commands/autostart.rs 的 StartupTask 模块）只在 windows 目标上参与编译。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: cargo check (default feature set)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo check (store feature universe)
        run: cargo check --manifest-path src-tauri/Cargo.toml --features store --tests

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  backend-linux:
    # linux_backend.rs 与它的判定用例都是 #[cfg(target_os = "linux")]，
    # Windows 上的 backend job 看不到它们 —— 不在这里编译，Linux 侧写坏了
    # 要等打 tag 时的 release 矩阵才发现，那是最糟糕的时机。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libayatana-appindicator3-dev 2>/dev/null || \
            sudo apt-get install -y libappindicator3-dev 2>/dev/null || true

      - name: cargo check (Linux, tests included)
        run: cargo check --manifest-path src-tauri/Cargo.toml --tests

      - name: cargo test (Linux)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
